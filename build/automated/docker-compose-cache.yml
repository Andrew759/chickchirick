services:
  nginx:
    build: ./build/automated/nginx
    ports:
      - '81:80'
    depends_on:
      - api-automated
    networks:
      - backend

  api-automated:
    build:
      context: .
      dockerfile: ./build/automated/Dockerfile-cache
    # Переменные окружения для ускорения BuildKit
    environment:
      - DOCKER_BUILDKIT=1
    ports:
      - "8081:8080"
    depends_on:
      postgres-automated:
        condition: service_healthy
    # volumes:
    #   - .:/app
    networks:
      - backend

  postgres-automated:
    image: postgres:17.2
    container_name: postgres-automated
    hostname: postgres-automated
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    networks:
      - backend
    volumes:
      - db_data_automated:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

