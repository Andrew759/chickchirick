services:
  nginx:
    build: ./build/dev/nginx
    ports:
      - '81:80'
    depends_on:
      - api-users
    volumes:
      - ./build/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend:
      chickchirick-shared-network:
        aliases:
        - api-users-nginx

  api-users:
    build:
      context: .
      dockerfile: ./build/dev/Dockerfile
    ports:
      - "8081:8080"
      - "40000:40000" # Порт для подключения IDE к отладчику
      - "6060:6060" #Порт трассировщика
    cap_add:
      - SYS_PTRACE # Разрешает Delve управлять процессом
    security_opt:
      - "seccomp=unconfined" # Отключает фильтрацию системных вызовов
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - backend
      - chickchirick-shared-network
