services:
  nginx:
    build: ./build/prod/nginx
    ports:
      - '81:80'
    depends_on:
      - api
    networks:
      - backend
  api:
    build:
      context: .
      dockerfile: ./build/prod/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - backend

  redis:
    image: redis:latest
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_INTERNAL_PORT}

  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    networks:
      - backend

networks:
  backend: