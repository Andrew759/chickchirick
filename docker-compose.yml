services:
  redis:
    image: redis:latest
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_INTERNAL_PORT}
    volumes:
      - ./redis_data:/data

  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    networks:
      - backend
    volumes:
      - ./db_data:/var/lib/postgresql/data

networks:
  backend: