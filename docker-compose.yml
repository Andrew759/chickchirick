services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile
    ports:
      - "8080:8080"
    #restart: unless-stopped
    #depends_on:
     # - redis
    #environment:
     # REDIS_URL: redis:6379
    volumes:
      - .:/app
    networks:
      - backend

  redis:
    image: redis:latest
    container_name: redis_container
    environment:
      #REDIS_PASSWORD: ${REDIS_MAIN_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_INTERNAL_PORT}
    volumes:
      - ./redis_data:/data

  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:${DB_INTERNAL_PORT}
    volumes:
      - ./db_data:/var/lib/postgresql/data

volumes:
  db_data:

networks:
  backend: